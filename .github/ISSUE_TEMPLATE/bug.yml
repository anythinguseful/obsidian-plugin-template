name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Concrete scenario first, then technical detail.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Settings tab header or `manifest.json`
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
